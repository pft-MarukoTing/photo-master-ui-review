[supervisord]
nodaemon=true
logfile=/app/log/_tmp_supervisord.log
logfile_maxbytes=1MB
logfile_backups=10
loglevel=info
pidfile=/app/log/_tmp_supervisord.pid

[program:server]
command=python3 -u /app/server.py
process_name=%(program_name)s
numprocs=1

autostart=true
autorestart=unexpected
startsecs=15
startretries=3
stopsignal=TERM
stopwaitsecs=20
exitcodes=9

stdout_logfile=/app/log/server_stdout.log  
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=10
stderr_logfile=/app/log/server_stderr.log  
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=10
