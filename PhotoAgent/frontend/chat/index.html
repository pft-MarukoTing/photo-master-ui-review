<!doctype html>
<html lang="zh-Hant" style="--scrollbar-accent-rgb: 185,81,27">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>[DEV] Photo master · 對話</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Inter carries the Latin; Noto Sans TC carries the CJK (Inter has no CJK
       glyphs, so it used to fall through to whatever the OS had). Noto Serif TC
       is the display face -- headline and panel titles only. -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <style>
    [hidden] { display: none !important; }

    /* ── Upload left column: holds drop zone OR preview ── */
    .upload-left {
      position: relative;
      display: flex;
      flex-direction: column;
      /* Grows to fill .upload-main-col's remaining space (see
         .upload-container/.upload-grid/.upload-main-col in
         styles.css) -- without this, only .upload-zone below flexed, but its
         own parent stayed auto-height and never actually offered it anything
         to grow into. */
      flex: 1 1 auto;
      min-height: 0;
      /* Narrower than the full main column now that the example-photo
         gallery sits beside it instead of only .upload-below-zone's pills
         underneath -- centered so it doesn't hug the gallery's edge. */
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      /* Safety net for narrow+short combos (e.g. a phone in landscape) that
         fall between the max-height/max-width breakpoints in styles.css:
         once .upload-zone's min-height floor genuinely doesn't fit the
         space .upload-left was assigned, this scrolls that overflow inside
         .upload-left instead of letting it paint past its own box and
         overlap .upload-below-zone (.upload-grid's other child, positioned
         right after .upload-left). */
      overflow-y: auto;
    }
    .upload-left .upload-zone {
      flex: 1;
    }
    /* Floating top-right of #dz-multi (both are #dz-multi's own siblings --
       drop-zone/preview are hidden whenever the multi-thumbnail strip is
       shown, so this still lands in the strip's own corner). Same icon-
       button look as .canvas-btn on the results page. Hidden by default,
       :has() shows it only while #dz-multi itself is visible -- avoids
       needing a matching hidden-toggle at every place app.js already
       shows/hides #dz-multi. */
    .dz-clear-all-btn {
      display: none;
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 5;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      padding: 0;
      border: 1px solid rgba(var(--on-surface-rgb),.16);
      border-radius: 50%;
      background: rgba(9,9,11,.55);
      backdrop-filter: blur(16px) saturate(1.4);
      -webkit-backdrop-filter: blur(16px) saturate(1.4);
      color: #fff;
      cursor: pointer;
      transition: background .2s, border-color .2s, transform .2s;
    }
    .upload-left:has(#dz-multi:not([hidden])) .dz-clear-all-btn { display: flex; }
    .dz-clear-all-btn:hover {
      background: rgba(255,38,0,.4);
      border-color: rgba(255,38,0,.55);
      transform: translateY(-1px);
    }
    #dz-preview {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      /* Was a flat 360px floor -- taller than the space .upload-left (a
         sibling flex chain, see .upload-container/.upload-grid in
         styles.css) can actually offer on a short/narrow viewport, so a
         selected photo rendered past .upload-left's own bottom edge and
         spilled over .upload-below-zone's pills below it. Matches
         .upload-zone's own floor instead (280px desktop / 160px under the
         existing 900px width breakpoint, see styles.css), since this and
         the empty drop zone are mutually-exclusive views of the same slot. */
      min-height: 280px;
      /* var(--card) alone is a flat, opaque fill -- it was blocking the
         page's own ambient glow (body's fixed-position radial-gradient,
         and #upload-section .upload-main-col's own one further down)
         wherever a selected photo doesn't fully cover this box (a
         narrower/shorter image leaves letterboxed margin on the sides or
         bottom). Against peach's n09==n04 (this card's fill is literally
         the same hex as the page), that flatness was the only thing left
         making the margins read as a different, flat "white" patch instead
         of continuing the same warm glow the empty drop zone shows through
         to (it's transparent, see .upload-zone below). farthest-corner,
         not a fixed pixel ellipse -- guarantees the glow actually reaches
         every corner of this box instead of leaving them a visible harder
         edge once it runs out. */
      background:
        radial-gradient(ellipse farthest-corner at 50% 38%, rgba(var(--accent-rgb),.11) 0%, rgba(var(--accent-2-rgb),.05) 45%, transparent 75%),
        var(--card);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      cursor: pointer;
      transition: box-shadow .25s, transform .25s;
    }
    #dz-preview:hover {
      box-shadow: var(--shadow-accent);
      transform: translateY(-2px);
    }
    /* Mirrors .upload-zone's own narrow-width floor (styles.css) -- has to
       live here too, not just there, since this ID rule's base min-height
       above sits in a later stylesheet (this inline block loads after
       styles.css) and would otherwise keep winning over an equal-specificity
       override placed only in styles.css regardless of the media query. */
    @media (max-width: 900px) {
      #dz-preview { min-height: 160px; }
    }

    .proc-container {
      max-width: 1425px;
    }

    /* ── proc-visual done state ── */
    .proc-visual {
      transition: width .5s ease, height .5s ease;
    }
    .proc-visual.done .think-ring {
      opacity: 0;
      pointer-events: none;
      animation-play-state: paused;
      transition: opacity .4s ease;
    }
    .proc-visual.done .think-center {
      inset: 0;
      border-radius: 14px;
      background: none;
      transition: inset .5s ease, border-radius .5s ease;
    }
    .proc-visual.done .proc-thumb {
      border-radius: 14px;
      /* Base .proc-thumb uses object-fit:cover to fill the circular
         thinking-state thumb -- once done, show the whole photo instead of
         cropping it to the box, so it keeps its own aspect ratio. */
      object-fit: contain;
      transition: border-radius .5s ease;
    }

    /* ── Step rich detail ──
       Neutral (not accent-tinted) so it doesn't fight with the green
       checked state below or whatever accent-colored controls sit inside
       it (style-option pills, etc.) -- just a faint highlight + hairline
       border to read as a grouped sub-panel, nothing more. */
    .step-list-frame {
      margin-top: 14px;
      background: rgba(var(--on-surface-rgb),.03);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
    }
    .step-inline-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .step-inline-list li label { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; }
    .step-inline-list li label:has(input:disabled) { opacity: .5; cursor: not-allowed; }
    .step-cb { position: relative; width: 20px; height: 20px; flex-shrink: 0; margin-top: 1px; }
    .step-cb input { position: absolute; opacity: 0; width: 0; height: 0; }
    .step-cb-box {
      display: block; width: 20px; height: 20px;
      border-radius: 4px; border: 1.5px solid var(--n44);
      background: var(--card-2);
      transition: border-color .15s, background .15s;
    }
    .step-cb input:checked + .step-cb-box {
      border-color: var(--accent);
      background: rgba(var(--accent-rgb),.18);
    }
    .step-cb-box::after {
      content: '';
      display: block;
      position: absolute; left: 6px; top: 3px;
      width: 6px; height: 10px;
      border: 2px solid var(--accent);
      border-top: none; border-left: none;
      transform: rotate(45deg) scale(0);
      transition: transform .15s;
    }
    .step-cb input:checked + .step-cb-box::after { transform: rotate(45deg) scale(1); }
    .step-cb-label { font-size: 16.25px; color: var(--text-3); line-height: 1.5; font-weight: 500; }
    .adherence-divider { height: 1px; background: var(--border); margin: 2px 0; }
    .step-tag-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .step-tag {
      display: inline-flex; align-items: center;
      padding: 4px 12px; border-radius: 20px;
      font-size: 15px; font-weight: 600;
      background: var(--card-2);
      border: 1px solid var(--border-2);
      color: var(--text-4);
    }

    /* ── Processing Time (Screen 3) ── */
    .timing-list {
      padding: 14px 20px 18px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .timing-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 16.25px;
      color: var(--text-2);
    }
    .timing-row.timing-sub {
      padding-left: 22px;
      font-size: 13.75px;
      color: var(--text-3);
    }
    .timing-row.timing-sub .timing-value { font-weight: 400; }
    .timing-value {
      font-weight: 700;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }
    .timing-total {
      border-top: 1px solid var(--border);
      padding-top: 9px;
      margin-top: 3px;
      color: var(--text);
    }
    .timing-total .timing-value { color: var(--accent); }

    /* ── Analysis preview (shown mid-processing, before "continue") ── */
    .analysis-preview {
      container-type: inline-size;
      container-name: ap-panel;
      margin-top: 32px;
      padding: 26px 28px;
      background:
        var(--card-sheen),
        var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      gap: 18px;
      animation: fadeUp .5s ease both;
      /* max-height is set from JS (updateAnalysisPreviewMaxHeight) -- same
         "avoid making the user scroll the window" policy as .batch-sidebar's
         own max-height, capping to the viewport instead of pushing the page
         taller when the recipe/options content is long. */
      overflow-y: auto;
    }
    /* Cancel (left) / continue (right) -- only unhidden for the inline
       results-page flow (see openInlineAnalysisPanel in app.js). Normal
       flow, not absolutely positioned, so it pushes the title down instead
       of risking an overlap with it. */
    .inline-analysis-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .analysis-preview-action {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 34px;
      padding: 0 16px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -.1px;
      cursor: pointer;
      transition: background .15s, border-color .15s, color .15s, transform .15s, box-shadow .15s;
    }
    .analysis-preview-action-left {
      border: 1px solid var(--border-2);
      background: var(--card-2);
      color: var(--text-2);
    }
    .analysis-preview-action-left:hover {
      background: rgba(255,38,0,.12);
      border-color: rgba(255,38,0,.35);
      color: var(--red);
    }
    .analysis-preview-action-right {
      border: none;
      background: var(--mv-grad);
      color: #fff;
      box-shadow: none;
    }
    /* Pushes .ap-settings-run-row (Run) to the far right of .ap-actions-row
       -- used to also carry #ap-advanced-settings-btn as a pair before
       人像修正設定 folded into 設定 instead (see #advanced-settings-fold),
       margin-left:auto stayed on the wrapper rather than moving onto Run
       itself since there's no upside to churning it now that it's a single
       child. */
    .ap-actions-row .ap-settings-run-row {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      margin-left: auto;
      /* Two children now (the settings icon + 美化), and this row sits inside
         a panel that can be as narrow as the side-panel layout allows -- let
         the icon drop onto its own line rather than pushing 美化 out of the
         panel. Right-aligned on both lines so 美化 stays where it has always
         been. */
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    /* #ap-case-settings-btn -- the case's own settings, one icon. It shares a
       row with 美化, whose job is to be pressed; spelling the values out here
       competed with that for width and attention, so they live in the button's
       title/aria-label instead (updateApCaseSettingsTrigger, app.js) and the
       button itself stays the size of the gear it replaces. A plain <button>
       opening a modal rather than a <details> dropdown: the pickers inside are
       themselves <details> with absolutely-positioned panels, and nesting those
       would have them spill out of their own container -- the same reason
       setupCompactUploadSelectors sends the upload page's compact selectors to
       #upload-selector-modal instead of into its menu panel. */
    /* Sliders rather than the header's own gear (#header-settings-btn) or the
       sparkle on every model picker: with no label on the button the glyph is
       the only thing naming it, and it must not read as either of the two
       things it deliberately isn't -- the app-wide 設定, or one more model
       picker. */
    .ap-case-settings-trigger {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      padding: 0;
      background: linear-gradient(135deg, rgba(var(--accent-rgb),.28), rgba(var(--accent-2-rgb),.16));
      border: 1px solid rgba(var(--accent-rgb),.52);
      border-radius: 50%;
      color: var(--text-1);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.18);
      cursor: pointer;
      transition: background .15s, border-color .15s, color .15s, box-shadow .15s, transform .15s;
    }
    .ap-case-settings-trigger:hover {
      background: linear-gradient(135deg, rgba(var(--accent-rgb),.4), rgba(var(--accent-2-rgb),.24));
      border-color: rgba(var(--accent-rgb),.72);
      color: var(--text-1);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.16);
      transform: translateY(-2px);
    }
    .ap-case-settings-trigger:active { transform: translateY(0) scale(.96); }
    .ap-case-settings-trigger:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }
    /* Shown by updateApCaseSettingsTrigger once the settings no longer match
       what this case actually ran with -- i.e. the moment they stop describing
       the image on screen and start describing the next edit. Cornered on the
       icon like a notification dot, with a ring in the row's own background so
       it reads as attached to the button rather than floating over it. */
    .ap-case-settings-dirty {
      position: absolute;
      top: 3px;
      right: 3px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 2px var(--card);
    }
    .ap-case-settings-trigger:has(.ap-case-settings-dirty:not([hidden])) {
      background: linear-gradient(135deg, rgba(var(--accent-rgb),.36), rgba(var(--accent-2-rgb),.22));
      border-color: rgba(var(--accent-rgb),.68);
      color: var(--text-1);
    }
    /* Leading note in #ap-case-settings-modal-body -- .option-desc's own color
       and size, just not squeezed into an .option-row's right-hand column. */
    .ap-case-settings-note {
      margin: 0 0 4px;
      line-height: 1.6;
    }
    .analysis-preview-action-right:hover {
      box-shadow: none;
      transform: translateY(-1px);
    }
    .analysis-preview-action:active { transform: scale(.96); }
    /* #inline-analysis-continue-btn's "nothing changed yet" state
       (updateInlineAnalysisContinueBtnState, app.js) still toggles
       .is-blocked, but a click here now opens waitForInlineAnalysisAction's
       confirm modal rather than truly blocking -- so the button keeps its
       normal look (color, cursor, hover) in this state too; .is-blocked is
       intentionally styleless. */
    .ap-row p { margin: 6px 0 0; }

    /* ── Analysis-preview label hierarchy ──
       .ap-label   = section header (修圖建議 / 修圖風格選項 / 分析結果)
       .ap-sub-label = sub-header nested one level in (Pose / Angle / 照片總覽 / 診斷與建議)
       Sub-labels must read as clearly subordinate to their section's .ap-label. */
    .ap-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 17.5px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -.14px;
    }
    /* Plain (non-toggle) section labels get an accent dot; toggle summaries
       already get a leading marker from their own chevron ::before below. */
    label.ap-label::before {
      content: '';
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }
    .ap-sub-label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-2);
      text-transform: uppercase;
      letter-spacing: .07em;
      margin: 16px 0 6px;
    }
    .ap-sub-label:first-child { margin-top: 0; }

    /* ── Step indicator (#ap-step-indicator) ──
       Lives in #step-indicator-slot, directly inside <main> and above all
       three screens (see its markup comment there) -- never inside the
       screen it happens to be describing, so no screen can hide it along
       with itself or give it its own spacing. setFlowStage (app.js) lights
       the current step; showSection (dom.js) shows/hides the slot. */
    .ap-step-indicator {
      display: flex;
      align-items: center;
      width: 100%;
      margin-bottom: 4px;
    }
    /* padding-top mirrors .results-container's own (styles.css) so the
       indicator sits exactly as far below the header as it did back when it
       was #results-detail's first child -- and that spacing is now the only
       one there is, for every screen. Declared after .container's
       `padding: 0 28px` shorthand (styles.css loads before this block), so
       this wins for the top edge while the 28px sides stay.
       --step-indicator-h is this slot's full laid-out height (20px padding +
       30px .ap-step-num + .ap-step-indicator's own 4px margin-bottom). The
       screens that size themselves against the viewport subtract it
       (styles.css: .proc-wrap, and the side-panel #results-detail rule),
       since the slot now takes that height off the top of all of them. */
    :root { --step-indicator-h: 54px; }
    .step-indicator-slot {
      padding-top: 20px;
    }
    /* 流程列右邊放「對話｜面板」切換（.mode-switch）。開關高 36px，比
       30px 的步驟圓圈高，用負的上下 margin 吃掉多出來的 6px，讓這列總高
       維持 --step-indicator-h 不變，開關跟圓圈也垂直置中對齊。 */
    .step-indicator-slot:not([hidden]) {
      display: flex;
      align-items: flex-start;
      gap: 24px;
    }
    .step-indicator-slot > .ap-step-indicator { flex: 1; min-width: 0; }
    .step-indicator-slot > .mode-switch { margin: -3px 0 1px; }
    /* 面板模式的按鈕大多是 .btn-secondary（卡片底＋細框＋小圓角），共用的
       灰軌道膠囊放在這裡像外來的。只在這裡改成同一套外框，目前那段用淡主色
       填色，跟對話頁把手旁那顆一致。總高維持 36px（1px 框＋2px 內距＋30px）。 */
    .step-indicator-slot > .mode-switch {
      padding: 2px;
      border: 1px solid var(--border-2);
      border-radius: 10px;
      background: var(--card-2);
    }
    .step-indicator-slot > .mode-switch .mode-switch-opt { border-radius: 8px; }
    .step-indicator-slot > .mode-switch .mode-switch-opt.is-active {
      background: rgba(var(--accent-rgb), .14);
      box-shadow: none;
    }
    /* 這列在的時候開關就是回對話的入口，header 不用再放一顆一樣的。 */
    body:has(#step-indicator-slot:not([hidden])) #chat-ui-btn { display: none; }
    .ap-step {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-2);
      font-weight: 600;
      font-size: 16px;
    }
    /* Ring drawn as an inset box-shadow, not a border -- a border at this
       1.5px (sub-pixel) width toggled to transparent for the active state
       (below) left a faint crescent where the circle's rounded corner
       rasterized slightly differently for the border layer vs. the
       background fill, most visible at higher zoom/DPI. box-shadow doesn't
       carve its own separately-anti-aliased edge the way a border does, so
       switching it off entirely for the active state (rather than just
       recoloring it transparent) leaves a clean gradient-filled circle. */
    .ap-step-num {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: transparent;
      box-shadow: inset 0 0 0 1.5px var(--border-2);
      color: var(--text-2);
    }
    /* No digits anymore -- an untouched future step is just an empty ring.
       The current step (.ap-step--active) fills in with a spinner while its
       work is still running, swapping to a check the moment it's marked
       done (.ap-step--checked, added alongside --active); a step that's
       already behind us (.ap-step--done) goes straight to a check, but
       stays in this same muted ring/color as a future step -- only the
       current step gets the highlighted gradient fill below, so at most one
       step reads as "highlighted" at a time. */
    .ap-step-num-check { display: none; }
    .ap-step-num-spinner {
      display: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, .35);
      border-top-color: #fff;
      animation: ap-step-spin .7s linear infinite;
    }
    @keyframes ap-step-spin {
      to { transform: rotate(360deg); }
    }
    .ap-step--active:not(.ap-step--checked) .ap-step-num-spinner { display: block; }
    .ap-step--active.ap-step--checked .ap-step-num-check,
    .ap-step--done .ap-step-num-check { display: block; }
    .ap-step--active { color: var(--text); }
    .ap-step--active .ap-step-num {
      background: var(--mv-grad);
      box-shadow: none;
      color: #fff;
    }
    .ap-step-line {
      flex: 1;
      height: 2px;
      margin: 0 12px;
      background: var(--border-2);
    }
    .ap-step-line--active {
      background: linear-gradient(90deg, var(--accent), var(--border-2));
    }
    /* Narrow phones: .ap-step's row layout (num circle + name side by side)
       has nowhere near enough width for 4 steps' worth of circle+label pairs
       plus their connecting lines, so labels wrapped/collided with the next
       step's circle. Stacking num-over-name per step keeps every step's own
       footprint narrow (just the circle's width) instead of circle+text.
       align-items:flex-start (overriding the row layout's own center) plus a
       matching margin-top on .ap-step-line keeps the connecting line level
       with the circles' own vertical center, rather than centering against
       each step's full two-line height (which would sit the line low). */
    @media (max-width: 560px) {
      /* Two-line steps here (circle stacked over name), so the slot is
         taller than the base 54px (measured: 73px box + the same 4px
         margin) -- kept in sync so the viewport-height screens subtract the
         right amount at this breakpoint too.
         「對話｜面板」在這裡另起一行放在步驟上面（見下面），所以再加上
         它那行：padding-top 從 20 收到 12，+36 開關 +12 間距，共 117px。 */
      :root { --step-indicator-h: 117px; }
      .ap-step-indicator { align-items: flex-start; }
      .ap-step {
        flex-direction: column;
        gap: 4px;
        text-align: center;
      }
      .ap-step-name { font-size: 15px; }
      .ap-step-line { margin: 14px 14px 0; }
      /* 步驟改直排後，開關跟它們擠在同一行會像第五個步驟。改成在步驟
         上面自己一行、靠右，跟桌機一樣在右邊。 */
      .step-indicator-slot:not([hidden]) {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
        padding-top: 12px;
      }
      .step-indicator-slot > .mode-switch { order: -1; align-self: flex-end; margin: 0; }
    }

    /* ── Shared collapsible-card shell for #ap-review-panel, the merged
       修圖建議 + 人像檢查 box -- replaces the old #ap-recipe-picker button +
       #ap-recipe-modal, the old per-person face-thumb-row + #ap-face-modal,
       and later the two separate #ap-recipe-inline/#ap-face-review cards
       once those were themselves merged into this one, switched by a
       top-level tab row instead of stacked on top of each other. One
       continuous box (background+border on the <details> itself) instead of
       a summary pill sitting above a separately-framed .step-list-frame --
       those used to read as two stacked, unrelated cards instead of one
       header-plus-body block. The summary is just this box's own top edge
       (padding only, no background/border of its own); a hairline
       border-top appears on it only once open, marking where the header
       ends and the body begins instead of a visible gap between two boxes.
       #ap-*-count (below) gives each tab something to say ("N 項"/"N 人")
       instead of just a plain label, which on its own read as plain text
       rather than a control on a first visit.
       Scoped to this one id rather than the shared .ap-options-toggle base
       rule, which other collapsible sections (Workflow Report, Technical
       Details, ...) still use plain. ── */
    /* No top border -- with it, #ap-review-panel's :has()-colored border
       (further down) drew a second line spanning the full row above every
       tab, floating disconnected above the active tab's own colored border
       instead of reading as one continuous outline. Leaving the top open
       means the active tab's own border is the only thing marking the top
       of the whole shape, and the card's left/right/bottom borders just
       pick up right where that tab's own bottom corners are.
       border-color falls back to var(--active-hue, var(--border-2)) --
       #ap-review-panel is the only element using this class, so the
       fallback is purely defensive, but it means the color source lives on
       the one box that actually owns border-radius. Drawing it here (not on
       .ap-toggle-card-body, which sits flush just inside this same edge)
       lets the browser's own border+radius rendering sweep the color
       smoothly around all 4 rounded corners -- a border drawn on a
       square-cornered inner box instead left the two bottom corners looking
       like they broke right where the outer rounded mask clipped them. */
    .ap-toggle-card {
      background: var(--card-2);
      border: 1px solid var(--active-hue, var(--border-2));
      border-top: none;
      border-radius: var(--radius-sm);
      overflow: hidden;
    }
    .ap-toggle-card > summary {
      padding: 10px 14px;
      transition: background .15s;
    }
    .ap-toggle-card > summary:hover { background: var(--card-3); }
    .ap-toggle-card[open] > summary { border-bottom: 1px solid var(--border-2); }
    .ap-toggle-card > summary::before { font-size: 13px; }
    /* No border of its own -- this box has no auto width, so it already
       fills .ap-toggle-card's inner edge exactly; drawing a second border
       here (an inset version, outline/negative-offset, was tried and
       reverted -- see git history) just stacked a square-cornered line
       immediately inside that outer rounded one, breaking at the two bottom
       corners where the overflow:hidden mask clipped it. The outer card's
       own border (above, colored via --active-hue) is the only line now. */
    /* overflow:hidden, not auto -- JS (syncAnalysisPanelHeights, app.js)
       sets this element's real height directly, and giving it its OWN
       scrollbar on top of each tab's already-independently-scrollable
       list/grid (#ap-recipe-list/#ap-face-detail/.ap-style-option-grid,
       each already capped + scrollable, see their own comments) produced
       two nested scrollbars at once. The rules on those elements make each
       fill this element's real height instead, so there's ever only one
       scrollable layer, and overflow:hidden here is purely a safety net
       for anything that still doesn't fit. */
    .ap-toggle-card-body {
      padding: 14px;
      overflow: hidden;
    }
    .ap-toggle-card .step-inline-list { gap: 10px; }
    /* #ap-review-panel's summary holds an extra row (the per-person avatar
       tabs, #ap-face-tabs -- visible even while the whole box is collapsed,
       but only when 人像檢查 is the active tab, see its own markup comment)
       below the top-level tab row. align-items:flex-start (overriding
       .ap-label's own center) pins this row to the top instead of centering
       against the taller two-row block below it. .ap-review-summary-inner
       is the sibling that actually stacks tab-row-then-avatar-row in a
       column. */
    .ap-review-summary { align-items: flex-start; }
    /* Zeroes out .ap-toggle-card > summary's own top+bottom padding (10px
       each) just for this summary -- id selector so it actually beats that
       rule's own specificity. Bottom: closes the gap between the tab row's
       bottom edge and the shoulder hairline below it (#ap-review-panel[open]
       > summary's own border-bottom, see its :has() coloring further down)
       so the active tab's own bottom sits flush against that line instead of
       floating 10px above it with a border-less stretch in between. Top:
       #ap-review-panel now sits nested inside #ap-analysis-shell's own
       padded body (14px, see .ap-analysis-shell-body below) instead of
       sitting directly on .options-card-inline, so its own extra 10px on
       top of that stacked into a 24px gap under the shell's divider --
       zeroed so the shell body's 14px is the only top spacing left. */
    #ap-review-panel > summary { padding: 0 14px; }
    /* .ap-options-toggle's shared chevron (▸, below) doubles up with the
       browser-style tab strip itself as an "expand this" cue here -- the
       tabs already read as clickable controls on their own, so the chevron
       just adds visual noise beside them. Higher specificity than
       .ap-options-toggle > summary::before (adds the .ap-review-summary
       class into the match) so this reliably wins regardless of source
       order. */
    .ap-options-toggle > summary.ap-review-summary::before { content: none; }

    /* ── #ap-analysis-shell: the outer title+collapse frame wrapping
       #ap-review-panel (see its own markup comment for why). Its own full
       card (background+4-sided border+radius), not the shared
       .ap-toggle-card class -- that class's border-top:none relies on
       #ap-review-panel's own tab strip to supply the top edge's only
       visible line (see that class's doc comment); this plain title
       summary has no tab strip, so reusing it verbatim would leave the top
       edge with no border at all. Giving the title row its own enclosing
       box (instead of floating loose above #ap-review-panel's separately
       framed one) is what makes the whole area read as one block instead
       of two disconnected pieces stacked with a gap between them --
       #ap-review-panel keeps its own border/background nested inside,
       reading as a highlighted sub-card rather than a second competing
       outer box (same fill color, just its own border). ── */
    /* ── #ap-photo-summary: quick-read badges+sentence sitting directly
       above #ap-analysis-shell (markup above). Its own small card (background
       +border, same --card-2/--border pair #ap-analysis-shell itself uses)
       instead of bare floating text -- a plain pill+sentence with no
       enclosing shape read as loose/monotonous next to the card below it.
       Accent-tinted badges (.ap-photo-summary-tags span, mirrors .mvp-badge's
       rgba(--accent-rgb) recipe) instead of .tag-row's plain gray pills, so
       subject/scene read as the headline facts they are rather than blending
       into muted metadata. ── */
    .ap-photo-summary {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 10px 12px;
      margin-bottom: 8px;
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      /* Full width of #ap-options-card-inline, matching #ap-analysis-shell
         directly below it -- without this it was the only child of that
         flex-wrap row without a width of its own, so it sized to its own
         content and came out narrower than the card below.
         width, deliberately NOT #ap-analysis-shell's flex-basis:100%: that
         row turns into flex-direction:column under body.side-panel-layout
         (styles.css), where flex-basis stops meaning width and starts
         meaning HEIGHT -- which is why the shell needs its own explicit
         `flex: 1 1 494px` override there. width:100% is the cross-axis
         size in that column and is what align-items:stretch already gives
         this card anyway, so it aligns the width in the row layout without
         touching the height in either. */
      width: 100%;
      position: relative;
    }
    /* Synced with .ap-analysis-shell-title (same icon+text pairing just
       below this card) instead of a small uppercase kicker -- reads as the
       same label style, not a competing typographic system. */
    .ap-photo-summary-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      font-size: 17.5px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -.14px;
    }
    .ap-photo-summary-label svg { flex-shrink: 0; color: var(--accent); }
    .ap-photo-summary-tags {
      display: flex;
      flex-wrap: wrap;
      flex: 1 1 auto;
      justify-content: flex-end;
      min-width: 0;
      gap: 6px;
    }
    .ap-photo-summary-tags span {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      background: rgba(var(--accent-rgb),.12);
      border: 1px solid rgba(var(--accent-rgb),.25);
      border-radius: 20px;
      font-size: 15px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -.05px;
    }
    .ap-photo-summary-text {
      margin: 0;
      font-size: 14px;
      line-height: 1.5;
      color: var(--text-2);
    }
    .ap-photo-summary-text:empty { display: none; }
    /* #ap-skip-analyze-btn: 幫我分析, left of 美化 for a 「只照需求改」 case
       (#ap-skip-hint explains why). Secondary to 美化, so the tonal accent
       pill rather than the gradient -- same sizing as its neighbour. */
    .ap-skip-analyze-btn {
      border: 1px solid rgba(var(--accent-rgb),.25);
      background: rgba(var(--accent-rgb),.12);
      color: var(--accent);
      font-family: inherit;
    }
    .ap-skip-analyze-btn:hover:not(:disabled) {
      background: rgba(var(--accent-rgb),.18);
      border-color: rgba(var(--accent-rgb),.4);
    }
    .ap-skip-analyze-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .ap-skip-analyze-btn:disabled { opacity: .55; cursor: progress; }
    /* The collapsed side panel stacks 美化 into a 44px letter column, which
       a second label can't share; 幫我分析 comes back with the panel. */
    body.side-panel-layout #results-analysis-slot:has(#ap-analysis-shell:not([open])) .ap-skip-analyze-btn {
      display: none;
    }
    .ap-photo-summary-toggle[hidden] { display: none; }
    .ap-photo-summary-toggle {
      position: absolute;
      right: 0;
      left: 0;
      bottom: 8px;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: max-content;
      max-width: calc(100% - 20px);
      padding: 3px 11px;
      margin-inline: auto;
      background: rgba(var(--accent-2-rgb),.16);
      border: 1px solid rgba(var(--accent-2-rgb),.22);
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(var(--on-surface-rgb),.12);
      color: var(--text-2);
      font-size: 13px;
      font-weight: 600;
      line-height: 1.3;
      opacity: .78;
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
      transition: opacity .15s, background .15s, color .15s;
    }
    .ap-photo-summary-toggle::before {
      /* A +/- rather than a chevron: everywhere else in the app a chevron
         means "scroll that way" (.ap-style-scroll-hint, #page-scroll-hint),
         and this toggle moves nothing -- it opens and closes a block in
         place, which is what 展開/收合 name. Drawn from two gradient bars
         instead of a '+' / '−' glyph, for the same reason the chevron it
         replaces was drawn from border corners: a glyph's own metrics decide
         where it sits in its box, and next to a 13px label it lands low and
         off-centre. Collapsing shrinks the upright bar to nothing from its
         own centre, so the mark performs 收合 rather than just labelling it. */
      content: '';
      display: inline-block;
      flex-shrink: 0;
      width: 9px;
      height: 9px;
      margin-right: 4px;
      background:
        linear-gradient(currentColor, currentColor) center / 9px 1.6px no-repeat,
        linear-gradient(currentColor, currentColor) center / 1.6px 9px no-repeat;
      transition: background-size .15s;
    }
    .ap-photo-summary-toggle[aria-expanded="true"]::before {
      background-size: 9px 1.6px, 1.6px 0;
    }
    .ap-photo-summary-toggle:hover {
      background: rgba(var(--accent-2-rgb),.24);
      color: var(--text);
      opacity: 1;
    }
    /* The toggle is position:absolute (bottom:8px, ~25px tall) so it doesn't
       take up flow space -- fine when --compact's fade gradient sits behind
       it, but once fully expanded the real text now reaches the card's own
       bottom edge with nothing behind the pill, so it lands on top of the
       last line. Reserve that room instead of overlapping it. */
    .ap-photo-summary.ap-photo-summary--expanded {
      padding-bottom: 40px;
    }
    .ap-photo-summary.ap-photo-summary--compact {
      max-height: var(--ap-photo-summary-compact-height, 280px);
      padding-bottom: 40px;
      overflow: hidden;
    }
    .ap-photo-summary.ap-photo-summary--compact .ap-photo-secondary-sections {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
    }
    .ap-photo-summary.ap-photo-summary--compact::after {
      content: '';
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: 48px;
      background: linear-gradient(to bottom, rgba(var(--on-surface-rgb),0), var(--card-2));
      pointer-events: none;
    }

    /* ── 照片總覽's header row: title left, category chips right.
       The issue-count badge uses a fixed off-family orange (not var(--accent)) so it reads
       the same "worth reviewing" signal in every theme, including the ones
       whose own accent already lives in the green/purple/cyan family --
       same fixed-color approach as .adherence-icon's --green/--red. ── */
    .ap-photo-summary-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .ap-photo-summary-badge {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      background: rgba(249,115,22,.14);
      border: 1px solid rgba(249,115,22,.28);
      border-radius: 20px;
      font-size: 12.5px;
      font-weight: 700;
      color: #F97316;
      white-space: nowrap;
    }
    .ap-photo-summary-badge[hidden] { display: none; }
    .ap-photo-summary-divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 15px 0;
    }
    .ap-photo-secondary-sections {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    /* 照片亮點 / 優先改善 share this label style -- same title treatment as
       .ap-photo-summary-label just smaller, so they read as sub-sections of
       the same card rather than a competing heading level. */
    .ap-photo-highlights-label,
    .ap-photo-issues-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -.1px;
    }
    .ap-photo-issues-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .ap-photo-highlights-label svg { flex-shrink: 0; color: var(--green); }
    .ap-photo-issues-label svg { flex-shrink: 0; color: #F97316; }
    .ap-photo-highlights-box {
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin-top: 10px;
      padding: 12px;
      background: rgba(1,179,123,.08);
      border-radius: 10px;
    }
    .ap-photo-highlight-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    .ap-photo-highlight-key {
      flex: 0 0 auto;
      min-width: 60px;
      font-size: 13px;
      font-weight: 700;
      color: var(--green);
    }
    .ap-photo-highlight-value {
      flex: 1;
      min-width: 0;
      font-size: 14px;
      line-height: 1.5;
      color: var(--text);
      white-space: normal;
      overflow-wrap: break-word;
      word-break: break-word;
    }
    .ap-photo-issues-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .ap-photo-issues-list-frame {
      position: relative;
      margin-top: 10px;
      padding: 0;
      background: rgba(249,115,22,.07);
      border-radius: 10px;
      overflow: hidden;
    }
    .ap-photo-issue-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 12px;
    }
    .ap-photo-issue-row + .ap-photo-issue-row {
      border-top: 1px solid rgba(249,115,22,.14);
    }
    .ap-photo-issue-num {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 20px;
      margin-top: 1px;
      border-radius: 6px;
      background: rgba(249,115,22,.16);
      color: #D5670F;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0;
    }
    .ap-photo-issue-text {
      flex: 1;
      min-width: 0;
      font-size: 14px;
      line-height: 1.5;
      color: var(--text);
      white-space: normal;
      overflow-wrap: break-word;
      word-break: break-word;
    }
    /* Narrower right panel (batch mode's sidebar eating into the canvas
       column, or a plain narrow viewport): stack 照片亮點's label/value
       instead of keeping them side by side, same container-query hook
       #ap-options-card-inline already uses for .ap-review-tab above. Issue
       rows stay number+text side by side at any width per spec. */
    @container options-card-inline (max-width: 520px) {
      .ap-photo-highlight-row { flex-direction: column; gap: 2px; }
      .ap-photo-highlight-key { min-width: 0; }
      .ap-photo-summary-tags { justify-content: flex-end; }
    }
    /* On a desktop-width right panel, keep the two semantic groups in one
       row. The divider switches from each section's horizontal rule to a
       single vertical rule between the columns. If either group is hidden,
       the :has() guard leaves the remaining group full-width and keeps its
       normal horizontal divider. */
    @container options-card-inline (min-width: 560px) {
      .ap-photo-secondary-sections:has(> .ap-photo-highlights:not([hidden])):has(> .ap-photo-issues:not([hidden])) {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 15px;
        margin-top: 15px;
      }
      .ap-photo-secondary-sections:has(> .ap-photo-highlights:not([hidden])):has(> .ap-photo-issues:not([hidden])) > .ap-photo-summary-divider,
      .ap-photo-secondary-sections:has(> .ap-photo-highlights:not([hidden])):has(> .ap-photo-issues:not([hidden])) .ap-photo-summary-divider {
        display: none;
      }
      .ap-photo-secondary-sections:has(> .ap-photo-highlights:not([hidden])):has(> .ap-photo-issues:not([hidden])) > .ap-photo-issues {
        min-width: 0;
        border-left: 1px solid var(--border);
        padding-left: 15px;
      }
    }
    .ap-analysis-shell {
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }
    .ap-analysis-shell > summary {
      padding: 10px 14px;
      cursor: default;
      transition: none;
    }
    .ap-analysis-shell[open] > summary { border-bottom: 1px solid var(--border-2); }
    /* Fixed, not auto -- without this, switching 人像檢查/修圖建議/修圖風格/
       補充指令 (whichever tab has more or less content) reflowed this whole
       card to a different height each time, shifting Run and everything
       below it. 494px matches side-panel-layout's own #ap-analysis-shell[open]
       target (styles.css) -- same inner content (#ap-review-panel's tab
       strip + each tab's own 260px-capped list), just sized via `height`
       here instead of `flex-basis` there, since this element is a
       flex-wrap ROW item (cross-axis = height) rather than a column one
       (main-axis = flex-basis). Shorter tabs just leave blank space below
       instead of shrinking the card -- see syncAnalysisPanelHeights (app.js)
       for how that space actually gets distributed down through
       #ap-review-panel/.ap-toggle-card-body. */
    #ap-analysis-shell[open] { height: 494px; }
    /* Stacked column, not .ap-label's own single row -- title+description
       block on top (left-aligned, untouched), the expand chevron in its own
       full-width row underneath, centered -- same "arrow centered below the
       label" idiom as a typical 載入更多/show-more control, just keeping
       this card's own icon+title+description intact above it instead of
       replacing them with that control's usual centered-text-plus-dividers
       look. align-items:stretch (the flex default, restated here since
       .ap-label's own center would otherwise win) lets both the title block
       and the chevron row size to the summary's full width -- the title
       block still reads left-aligned since its own content just sits at
       that width's left edge, and the chevron row needs the full width for
       justify-content:center to center against the card, not just against
       the title text above it. */
    .ap-analysis-shell-summary {
      flex-direction: column;
      align-items: stretch;
      gap: 6px;
    }
    /* The outer analysis shell is informational and stays open; its summary
       has no collapse affordance. */
    .ap-options-toggle > summary.ap-analysis-shell-summary::before { content: none; }
    .ap-analysis-shell-summary-inner {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    /* Small sparkle icon ahead of the title text -- a quick "this came from
       the model" cue, same reasoning as the title/description text
       themselves (see the markup comment above #ap-analysis-shell): this
       whole area reads as AI-generated analysis the user can still adjust,
       not just another plain section label. Accent-colored (the same hue
       used for .ap-label's own dot elsewhere) so it doesn't read as a
       generic bullet. */
    .ap-analysis-shell-title {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .ap-analysis-shell-icon { color: var(--accent); flex-shrink: 0; }
    .ap-analysis-shell-desc {
      /* The description belongs to the summary's title block, directly below
         the title and above the selector body. */
      margin: 0;
      font-size: 13px;
      font-weight: 400;
      color: var(--text-3);
      letter-spacing: 0;
    }
    /* min-height:0 so JS (syncAnalysisPanelHeights, app.js) can force this
       shorter than its own content's natural size, not just taller --
       needed once #ap-analysis-shell[open]'s own height is fixed (above)
       rather than however tall this body happens to want to be. */
    .ap-analysis-shell-body { padding: 14px; min-height: 0; }

    .ap-review-summary-inner {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }
    /* The two top-level tabs (修圖建議/人像檢查) that switch which of
       #ap-recipe-list / #ap-face-detail (+ #ap-face-tabs) is visible
       (applyActiveReviewTab, results.js) -- plain buttons rather than a
       second nested <details>, since only one side needs to show at a time
       instead of each independently collapsible. Each stops its own click
       from bubbling to the summary's native click-to-toggle and force-opens
       the box instead (same reasoning as the per-person avatar tabs below),
       so picking a tab always reveals its content rather than sometimes
       just collapsing the box. */
    /* Browser-tab style (rounded top corners, active tab's background
       matching the panel body so it reads as "merged" with the content
       below, inactive tabs a visibly separate muted chip sitting behind
       it) -- replaces both the earlier pill-button look and an underline
       variant tried in between. */
    /* align-items:flex-end (not the flex default, stretch) keeps every
       tab's bottom edge on the same shared baseline -- the active tab's own
       extra padding-top (below) then makes it grow taller upward only,
       poking up above its neighbors like a real 凸-shaped tab, instead of
       stretch forcing every tab to the same height. */
    /* gap:0 (not a visible gutter) -- a gap here left a bare stretch of the
       card's own background between every pair of tabs with no border
       crossing it at all, breaking the colored outline right where two
       tabs meet. Flush neighbors let each tab's own border (gray sides,
       active-hue bottom) touch its neighbor's directly instead.
       margin:0 -14px bleeds this row out of <summary>'s own 14px side
       padding, same trick as #ap-face-tabs below -- without it, whichever
       tab sits first or last had its own colored side border sitting a
       flat 14px inside the card's own colored edge (above), reading as two
       parallel lines with a dark gap between them instead of one. No
       compensating padding needed here (unlike #ap-face-tabs, whose
       children are fixed-size avatars) since the scroll row itself fills
       the available width and the tabs keep their intrinsic widths. */
    .ap-review-tabs {
      display: flex;
      align-items: flex-end;
      flex-wrap: nowrap;
      gap: 0;
      margin: 0 -14px;
      min-width: 0;
      overflow-x: auto;
      overflow-y: hidden;
      overscroll-behavior-x: contain;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
    }
    .ap-review-tabs::-webkit-scrollbar { height: 4px; }
    .ap-review-tabs::-webkit-scrollbar-thumb {
      background: var(--border-2);
      border-radius: 999px;
    }
    /* Keep every tab at its natural width. On a narrow phone the row itself
       scrolls horizontally, so labels stay readable instead of shrinking or
       wrapping inside a tab. */
    .ap-review-tab {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1 0 auto;
      min-width: max-content;
      gap: 6px;
      padding: 7px 10px;
      border: 1px solid var(--border-2);
      border-radius: 10px 10px 0 0;
      background: var(--card-3);
      color: var(--text-2);
      font-size: 16px;
      font-weight: 700;
      font-family: inherit;
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    /* The label stays intrinsic-width so the scroll container, rather than
       the tab, owns any overflow on narrow screens. */
    .ap-review-tab-label {
      flex: 0 0 auto;
      min-width: max-content;
      white-space: nowrap;
      text-align: center;
    }
    /* line-height:1 above (not the default "normal") -- CJK glyphs pull in a
       fallback font (Inter above has no CJK coverage), and "normal"'s
       reserved leading for that fallback varies a lot by platform/OS font --
       comfortable on this codebase's own dev/test environment, tight enough
       on some real phones to visibly crowd the active tab's larger label
       against its own bottom border. A fixed 1 makes the line box just the
       font-size itself everywhere, so the padding around it (below) means
       the same thing on every device instead of guessing at extra leading. */
    /* Icon size is set via width/height attributes on the <svg> itself
       (index.html markup, 14x14) -- CSS width/height here still wins over
       those (presentational attributes sit at the bottom of the cascade),
       bumping the base size up to match the tab label's own larger
       font-size above. */
    .ap-review-tab .ic { width: 16px; height: 16px; }
    .ap-review-tab:hover { color: var(--text); }
    /* Every tab's own bottom border picks up the currently active tab's hue
       (--active-hue, set on #ap-review-panel via :has() below) instead of
       staying neutral -- this is the "shoulder" that visually connects the
       card's colored sides across to the active tab, without needing one
       shared border-bottom on the summary itself (which has no way to skip
       just the segment under whichever tab happens to be active, see git
       history). The active tab itself overrides this back to none just
       below -- it's meant to blend straight into the card, not look boxed
       in on all 4 sides. */
    .ap-review-tab { border-bottom-color: var(--active-hue, var(--border-2)); }
    .ap-review-tab.is-active { border-bottom: none; }
    /* Matches #ap-review-panel's own background (.ap-toggle-card, above) --
       the active tab visually fuses with the body content beneath it
       instead of reading as a separate chip like the inactive tab beside it.
       padding-top/bottom close to the same 7px every tab uses (the colored
       border/bottom-hairline system, further down, already answers "which
       tab is active" on its own, so this no longer needs to poke up taller
       than its neighbors to say the same thing) -- just a couple more px on
       both sides than that 7px, since this tab's own font-size is larger
       than its neighbors' and 7px alone left its label sitting right up
       against the bottom border instead of clear of it. */
    .ap-review-tab.is-active {
      background: var(--card-2);
      color: var(--text);
      padding-top: 9px;
      padding-bottom: 9px;
      font-size: 17px;
    }
    /* Grows further still than the base .ic bump above -- the active tab's
       icon ends up a little larger than every inactive one's, same as its
       label text. Only 1px over each -- a real phone's own CJK fallback
       font still ran this right up against the tab's own border even after
       line-height:1 and the extra padding above, so the gap between active
       and inactive sizing is deliberately small now, not the earlier
       18px/19px. */
    .ap-review-tab.is-active .ic { width: 17px; height: 17px; }
    /* Give the next tab a little more visibility on narrow panels without
       changing the label size or wrapping it. This is count-independent:
       whichever tab follows the last fully visible one gets the exposed
       sliver naturally from the scroll row. */
    @container options-card-inline (max-width: 520px) {
      .ap-review-tab {
        gap: 4px;
        padding-left: 8px;
        padding-right: 8px;
      }
      .ap-review-tab .ic { width: 15px; height: 15px; }
      .ap-review-tab.is-active .ic { width: 16px; height: 16px; }
    }
    /* Each tab carries its own hue (--hue, set per id below) instead of one
       shared gray/purple -- the icon shows that hue at low opacity even at
       rest (some color identity before you've touched anything), full
       saturation once active, and the active tab's whole border picks up
       the same color -- "which tab is active" and "what kind of tab this
       is" answered by one color instead of two separate cues. The four raw
       values live once on #ap-review-panel itself (inherited down to every
       tab) so the :has() rule below can reuse them for the card's own
       border instead of repeating the hex literals a second time.
       One coordinated pink -> fuchsia -> violet -> indigo sweep (an early
       version mixed in an amber/gold for 修圖建議, which read as an odd
       warm outlier against the other three cool/magenta tones) -- violet
       stays the app's own --accent, the other three are evenly spaced
       around it on the same wheel so the set reads as one family. */
    #ap-review-panel {
      --hue-face: #F472B6;
      --hue-recipe: #E879F9;
      --hue-style: var(--accent);
      --hue-prompt: #818CF8;
    }
    /* Floor, not the actual size -- JS (syncAnalysisPanelHeights, app.js)
       sets this panel's real height directly from #ap-analysis-shell's own
       fixed height (above), this is just a fallback so it never collapses
       to something unusably small before that first runs. */
    #ap-review-panel[open] { min-height: 160px; }
    #ap-review-tab-face   { --hue: var(--hue-face); }
    #ap-review-tab-recipe { --hue: var(--hue-recipe); }
    #ap-review-tab-style  { --hue: var(--hue-style); }
    #ap-review-tab-prompt { --hue: var(--hue-prompt); }
    .ap-review-tab .ic { color: var(--hue); opacity: .5; flex-shrink: 0; transition: opacity .15s; }
    .ap-review-tab.is-active .ic { opacity: 1; }
    .ap-review-tab.is-active {
      border-color: var(--hue);
    }
    /* --active-hue mirrors whichever tab is currently .is-active -- read by
       .ap-toggle-card-body's own border (below), #ap-face-tabs's border,
       and every inactive tab's own border-bottom (above), so all of them
       stay in sync off one source instead of separate copies of the same
       4-way mapping. :has() (already used elsewhere in this file, see
       .option-pill-group:has(...) below) reads straight off the DOM, no JS
       needed. */
    #ap-review-panel:has(#ap-review-tab-face.is-active)   { --active-hue: var(--hue-face); }
    #ap-review-panel:has(#ap-review-tab-recipe.is-active) { --active-hue: var(--hue-recipe); }
    #ap-review-panel:has(#ap-review-tab-style.is-active)  { --active-hue: var(--hue-style); }
    #ap-review-panel:has(#ap-review-tab-prompt.is-active) { --active-hue: var(--hue-prompt); }
    /* .ap-review-tab/.ap-face-tabs/#ap-recipe-list/
       .ap-style-option-grid/.ap-style-scroll-hint each set their own display
       (flex/grid) unconditionally -- an author rule for the same property
       always beats the browser's own [hidden]{display:none} UA rule
       regardless of specificity (the exact bug .ap-recipe-inline's stale
       selector caused once already, see git history), so each gets its own
       explicit [hidden] override here instead. */
    .ap-review-tab[hidden],
    .ap-face-tabs[hidden],
    #ap-recipe-list[hidden],
    .ap-style-option-grid[hidden],
    .ap-style-scroll-hint[hidden] { display: none; }

    /* Hairline divider between each top-level section of the panel */
    .analysis-preview > .ap-row + .ap-row {
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }

    /* .options-card-inline is a plain flex-wrap row whose visual order is
       driven entirely by these order: integers (not DOM position) -- two
       full-width (flex-basis:100%) blocks, top to bottom: the merged
       4-tab (人像檢查/修圖建議/修圖風格/補充指令) review panel (0), then the
       operational controls (order:3, below) -- read the review tabs first,
       adjust portrait settings and run last.
       #ap-step-indicator is no part of this element at all any more (it used
       to be a sibling that travelled alongside it) -- it lives in
       #step-indicator-slot above every screen now, see its markup comment
       inside <main>. */
    /* ID, not the shared .ap-toggle-card class -- when that class was
       introduced (unifying the two review cards' look, before they were
       themselves merged into this single panel) a same-named rule was once
       left keyed to a stale per-section class instead, silently dropping
       its flex-basis:100%. Keeping this one keyed to the id avoids
       repeating that.
       Keyed to #ap-analysis-shell (the outer title+collapse frame), not
       #ap-review-panel any more -- #ap-review-panel is now nested one level
       inside it, so #ap-analysis-shell is the actual flex child of
       .options-card-inline that needs the order/flex-basis. */
    #ap-analysis-shell { order: 0; flex-basis: 100%; }
    /* Holds .ap-settings-run-row (人像修正設定/Run) on its own full-width block,
       last -- 修圖風格/補充指令 used to sit here too (a trigger button and a
       textarea) before both became tabs of #ap-review-panel above.
       Sticky, not static -- #analysis-preview (this row's scrolling
       ancestor, see its own max-height/overflow-y comment) caps the whole
       panel to the viewport, and #ap-review-panel's content (e.g. the 修圖
       風格 tab's own option grid) can grow taller than that on its own.
       Pinning this row to the scroll container's own bottom edge keeps Run
       reachable without scrolling past it whenever that happens, instead of
       it just sliding out of view under a tall tab body. No background:
       an earlier version had one here (matching #analysis-preview's solid
       layer) to stop sticky content bleeding through underneath it, but
       that read as a stray extra box behind the Run pill, so it was
       dropped in favor of a plain border-top divider instead. padding-top:
       0 to match -- 16px of top padding only made sense stacked against
       that same background box. */
    .ap-actions-row {
      order: 3;
      flex-basis: 100%;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-top: 6px;
      padding-top: 0;
      border-top: 1px solid var(--border);
      position: sticky;
      bottom: 0;
      z-index: 2;
    }

    .ap-options-toggle > summary {
      cursor: pointer;
      user-select: none;
      list-style: none;
    }
    .ap-options-toggle > summary::-webkit-details-marker { display: none; }
    .ap-options-toggle > summary::before {
      content: '▸';
      display: inline-block;
      font-size: 14px;
      color: var(--text-2);
      transition: transform .15s;
      margin-right: -2px;
    }
    .ap-options-toggle[open] > summary::before { transform: rotate(90deg); }
    .ap-options-toggle > summary:hover { color: var(--accent); }
    .ap-options-toggle > summary:hover::before { color: var(--accent); }
    .ap-analysis-shell > summary.ap-analysis-shell-summary:hover {
      color: inherit;
      background: transparent;
    }

    /* ── Style-option pickers (Pose/Angle/Lighting/Size): a row of pill
       buttons, each a <details> whose panel pops over the content below
       instead of expanding it -- picking an option closes the panel and
       shows the pick on the pill itself, e.g. "Pose · Playful". ── */
    .ap-style-item { position: relative; }
    .ap-style-trigger {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 41px;
      /* Explicit height (not just padding + line-height) -- some triggers
         here (模型/生成張數) are <summary>, others (Pose/Angle/Lighting/Size)
         are plain <button>; padding alone happened to compute to the same
         height for both, but pinning it directly guarantees they never
         drift out of line with each other regardless of any
         button-vs-summary UA quirk. */
      padding: 0 16px;
      background: var(--card-2);
      border: 1px solid var(--border-2);
      border-radius: 20px;
      cursor: pointer;
      user-select: none;
      list-style: none;
      font-size: 15px;
      white-space: nowrap;
      transition: border-color .15s, background .15s, box-shadow .15s, transform .15s;
    }
    .ap-style-trigger::-webkit-details-marker { display: none; }
    .ap-style-trigger:hover { border-color: rgba(var(--accent-rgb),.4); transform: translateY(-1px); }
    .ap-style-trigger::after {
      content: '▾';
      font-size: 22px;
      color: var(--text-2);
      transition: transform .15s;
    }
    .ap-style-item[open] > .ap-style-trigger {
      border-color: var(--accent);
      background: rgba(var(--accent-rgb),.14);
      box-shadow: 0 0 0 3px rgba(var(--accent-rgb),.14);
    }
    .ap-style-item[open] > .ap-style-trigger::after { transform: rotate(180deg); }
    /* Tab row of every detected person's thumbnail (renderFaceTabs, results.js)
       -- keeps the compact "縮圖" look the old #ap-face-thumb-row avatar row
       had, but the click target now switches which person's detail shows in
       #ap-face-detail below instead of opening #ap-face-modal. Only one
       person's detail renders at a time, so there's no per-card expand/
       collapse state to keep visually aligned across a row of neighbors. */
    /* Only ever visible when 人像檢查 is the active tab (see its own
       applyActiveReviewTab hidden-toggle, results.js). No border of its own
       -- the outer card's own colored sides (above) already run past this
       row on their way down to .ap-toggle-card-body, so a second colored
       border here was redundant, not connective. */
    /* nowrap + horizontal scroll instead of flex-wrap, so a photo with many
       faces never pushes this row to a second/third line -- same idea as
       .ap-review-tabs above. padding-top/bottom (not just the original
       left/right) is load-bearing here in a way it isn't for
       .ap-review-tabs: setting overflow-x forces overflow-y to compute to
       "auto" too (a paired-axis CSS rule, not a bug), so without it the
       active tab's own ring and the issue badge -- both of which already
       painted a few px past their own box on purpose (see is-active and
       .ap-face-tab-badge below) -- would get clipped top/bottom by this
       row's own new scroll box instead of just overlapping whatever used to
       sit harmlessly above/below it. */
    .ap-face-tabs {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 10px;
      padding: 6px 10px;
      /* This row's own parent (.ap-review-summary-inner, a column flex box)
         stretches it to full width, but a flex item's default min-width is
         its content's min-content size, not 0 -- without overriding that,
         this row would rather grow past the stretch target to fit every
         avatar unbroken than actually shrink and let overflow-x do
         anything, and it'd get silently clipped by an ancestor's own
         overflow:hidden (.ap-toggle-card-body) with no scrollbar ever
         appearing. Same reason .ap-review-tabs above has this too. */
      min-width: 0;
      overflow-x: auto;
      overscroll-behavior-x: contain;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
    }
    .ap-face-tabs::-webkit-scrollbar { height: 4px; }
    .ap-face-tabs::-webkit-scrollbar-thumb {
      background: var(--border-2);
      border-radius: 999px;
    }
    /* Separate wrapper around the button + badge, NOT overflow:hidden itself
       -- .ap-face-tab below needs overflow:hidden to clip its square
       thumbnail image into a circle, but that same property would just as
       readily clip .ap-face-tab-badge's corner (positioned to hang slightly
       outside the circle) if the badge were its child instead of its
       sibling here. The active-state ring lives on this wrapper for the
       same reason -- a box-shadow drawn on the clipped button would itself
       get clipped right at the circle's own edge. */
    .ap-face-tab-wrap {
      position: relative;
      display: inline-flex;
      flex-shrink: 0;
      border-radius: 50%;
    }
    /* A translucent ring alone blended into the thumbnail's own border at
       this size, so the selected face was easy to miss at a glance. A solid
       --card-2 gap plus a solid --accent ring (an opaque "target" outline,
       not a soft glow) reads clearly regardless of what's in the photo
       behind it. */
    .ap-face-tab-wrap.is-active {
      box-shadow: 0 0 0 2px var(--card-2), 0 0 0 4px var(--accent);
    }
    /* Everyone starts a notch below the row's old 44px so the active one has
       somewhere to grow into (below) without the row itself getting any
       taller. This is real width/height, not a transform -- a transform
       paints outside the element's box without the flex row ever finding
       out, which is exactly what made the row look like it was overflowing
       when the active tab was scaled up instead. Growing the actual box
       means the row's height is (once again) just "however tall its
       tallest child really is", same as it's always been, and the active
       tab's 44px real size is that original tallest size -- so the row's
       own height never changes from what it was before any of this.
       Width/height deliberately aren't in the transition below -- animating
       them smoothly means for ~150ms BOTH the old and new active tab sit at
       some in-between size, so the row's "tallest child" briefly dips below
       44px and springs back once the swap finishes: the exact bounce this
       was meant to fix. Swapping the size instantly keeps exactly one tab
       at 44px on every single rendered frame, so the row's height never
       moves at all. */
    .ap-face-tab {
      width: 38px;
      height: 38px;
      padding: 0;
      border: 1.5px solid var(--border-2);
      border-radius: 50%;
      background: var(--card-3);
      cursor: pointer;
      overflow: hidden;
      transition: border-color .15s, transform .15s;
    }
    .ap-face-tab:hover { transform: translateY(-1px); }
    .ap-face-tab-wrap.is-active .ap-face-tab {
      width: 44px;
      height: 44px;
      border-color: var(--accent);
    }
    .ap-face-tab-img { width: 100%; height: 100%; object-fit: cover; display: block; }
    /* A face beyond the local crop cap, or a subjects[] entry the model found
       on its own with no backing local detection (results.js's sentToModel
       !== true) -- no zoomed close-up ever reached the model for this one, so
       dim it a touch; #ap-face-detail's own note (buildPersonIssueItems)
       spells out the same caveat in words once this tab is selected. */
    .ap-face-tab--local-only { opacity: .6; outline: 1.5px dashed var(--border-2); outline-offset: 1px; }
    /* Lets the user spot which people have a flagged issue without stepping
       through every tab -- reflects the model's own should_fix/adjust_safe
       verdict, not the allow/deny toggle in #ap-face-detail, so it stays put
       even after a flagged fix is turned off (still something the analysis
       found, just no longer approved). A sibling of .ap-face-tab (see
       .ap-face-tab-wrap above), not its child, so .ap-face-tab's own
       overflow:hidden circle-clip doesn't cut it off. */
    .ap-face-tab-badge {
      /* Same subtle tinted-not-solid treatment the very first version of
         this hint used (the old #ap-face-thumb-row avatar badge) -- a solid
         opaque red circle read as a notification/alert bubble, more
         attention-grabbing than this is meant to be (just "worth a look",
         not "something's wrong"). */
      position: absolute;
      top: -4px;
      right: -4px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: rgba(239, 68, 68, .18);
      color: var(--red);
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      /* Separates the badge from whatever photo/color sits directly behind
         it (the avatar thumbnail) without reading as its own hard outline --
         a dark ring (var(--card-2), then a translucent black) both read as
         a heavier outline than the badge's own translucent red fill. Same
         light, barely-there border-2 tone the tab avatars themselves use,
         instead of a dark one, keeps it consistent with the rest of the
         panel's subtle-border language. */
      box-shadow: 0 0 0 1.5px var(--border-2);
    }
    .ap-face-detail-name {
      font-weight: 700;
      color: var(--text);
      font-size: 15px;
      margin: 0 0 10px;
    }
    /* Debug-only: the analysis model's own reasoning for a flagged item
       (buildPersonIssueItems, results.js) -- its own line under the verdict
       label, smaller/muted so it reads as supporting detail, not another
       checklist row. */
    .ap-face-issue-reason {
      margin: 4px 0 0 30px;
      font-size: 12.5px;
      line-height: 1.4;
      color: var(--text-2);
    }
    /* Capped + scrollable, same "小視窗" treatment as .ap-style-option-grid
       (below) -- 修圖建議/人像檢查 can each run long (many recipe items, or a
       person with several flagged issues + reasons), and #analysis-preview
       (this pair's own scrolling ancestor) only caps to the viewport as a
       whole, not per-tab. Without their own cap, a long tab body reads the
       same as the style grid used to: it just keeps growing until Run
       (#analysis-preview's sticky-bottom .ap-actions-row) is many scrolls
       away instead of one short scroll inside the tab itself.
       max-height:100%, not a flat px value -- fills .ap-toggle-card-body's
       real, JS-computed height (syncAnalysisPanelHeights, app.js) exactly,
       so .ap-toggle-card-body itself never needs its own second scrollbar,
       while still capping+scrolling internally whenever a tab's content is
       actually longer than that. */
    #ap-recipe-list,
    #ap-face-detail {
      max-height: 100%;
      overflow-y: auto;
    }
    /* Same has-more-above/has-more-below inset-shadow cue as
       .ap-style-option-grid (below), driven by the same generic
       updateListScrollCue (app.js) -- without it, content actually cut off
       by the max-height cap above read as a layout bug (a flush edge with
       no visual sign there's more below), not "this scrolls". */
    #ap-recipe-list.has-more-below,
    #ap-face-detail.has-more-below {
      box-shadow: inset 0 -24px 16px -18px rgba(0,0,0,.45);
    }
    #ap-recipe-list.has-more-above,
    #ap-face-detail.has-more-above {
      box-shadow: inset 0 24px 16px -18px rgba(0,0,0,.45);
    }
    #ap-recipe-list.has-more-above.has-more-below,
    #ap-face-detail.has-more-above.has-more-below {
      box-shadow: inset 0 24px 16px -18px rgba(0,0,0,.45), inset 0 -24px 16px -18px rgba(0,0,0,.45);
    }
    .ap-style-name {
      font-weight: 700;

      width: 100%;
      /* Source images are portrait but not all the same ratio (1024x1536 and
         1120x1408) -- cover fills the card's 2:3 box to full height and
         centre-crops the sides, so every thumbnail is the same size. */
      aspect-ratio: 2 / 3;
      object-fit: cover;
      border-radius: calc(var(--radius) - 4px);
      background: var(--card-3);
    }
    .ap-style-option-thumb-default {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-3);
      font-size: 13px;
      font-weight: 600;
      border: 1.5px dashed var(--border-2);
    }
    .ap-style-option-label {
      font-size: 13.75px;
      font-weight: 600;
      color: var(--text-2);
      text-align: center;
    }
    .ap-analysis-body {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 10px;
    }
    .ap-diagnosis-text {
      font-size: 16.25px;
      color: var(--text-3);
      line-height: 1.6;
      letter-spacing: -.13px;
    }
    .ap-analysis-body .ap-composition-text {
      margin-top: 10px;
      padding-left: 12px;
      border-left: 2px solid rgba(var(--accent-rgb),.45);
      font-size: 15px;
      color: var(--text-2);
      line-height: 1.5;
      letter-spacing: -.12px;
    }
    .ap-option-groups {
      display: grid;
      grid-template-columns: repeat(4, minmax(0,1fr));
      gap: 16px;
    }
    @media (max-width: 900px) {
      .ap-option-groups { grid-template-columns: repeat(2, minmax(0,1fr)); }
    }
    @media (max-width: 560px) {
      .ap-option-groups { grid-template-columns: 1fr; }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Photo frame wrapper ── */
    .photo-frame-wrap { position: relative; }

    /* ── Summary band list ── */
    .sb-list { margin: 0; padding-left: 1.2em; }
    .sb-list li { margin-bottom: 2px; }

    /* ── Multi-file upload thumbnail strip ── */
    .dz-multi {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
      /* Explicit min-content instead of the implicit "auto" default -- on a
         narrow viewport (auto-fill collapses to a single column) the browser
         under-measures each row's aspect-ratio-driven height and the square
         thumbnails end up stacked with overlapping rows instead of a clean
         list. min-content forces it to size each row off the thumb's real
         (aspect-ratio) height. */
      grid-auto-rows: min-content;
      align-content: flex-start;
      gap: 12px;
      padding: 20px;
      /* flex:1 with no max-height matches #dz-preview/.upload-zone's own
         "grow/shrink to fill .upload-grid's remaining space" behavior --
         this and those two are mutually-exclusive views of the same slot
         (empty drop zone / single preview / this grid), so a flat
         max-height here (used to be 420px) made this one visibly shorter
         than the other two even when .upload-left had plenty of room left
         below it, packing photos into an internal scrollbar that didn't
         need to be there. overflow:auto stays regardless, as the fallback
         for whenever the grid's real content (many photo rows) still needs
         more height than the space it was actually given. min-height:360px
         (taller than #dz-preview/.upload-zone's 280px floor, see their own
         comments) is its own floor for short viewports, same idea as
         those two, just taller since a usable grid needs more than a
         centered icon/single photo does. */
      overflow: auto;
      flex: 1;
      min-height: 360px;
      /* Same flat-var(--card) issue as #dz-preview above (see its own
         comment) -- a few small thumbnails leave most of this grid as bare
         card color, which read especially flat here since it's the
         tallest/emptiest of the three .upload-left views. */
      background:
        radial-gradient(ellipse farthest-corner at 50% 30%, rgba(var(--accent-rgb),.11) 0%, rgba(var(--accent-2-rgb),.05) 45%, transparent 75%),
        var(--card);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      transition: box-shadow .25s, transform .25s;
    }
    /* No cursor:pointer -- only #dz-add-more is actually clickable now (see
