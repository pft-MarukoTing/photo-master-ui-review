       plain flex row, not a relatively-positioned tile). Always visible,
       same reasoning as .history-cube-remove: no hover state to reveal it
       on touch devices. */
    .report-item-remove {
      flex-shrink: 0;
      margin-left: auto;
      width: 22px;
      height: 22px;
      border: none;
      border-radius: 50%;
      background: rgba(0,0,0,.3);
      color: var(--text-3);
      font-size: 14px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      transition: background .15s, color .15s, transform .15s;
    }
    .report-item-remove:hover { background: rgba(220,60,60,.85); color: #fff; transform: scale(1.08); }
    /* Triage state, cycled by its own click (unread -> read -> solved ->
       unread; see nextReportStatus/setReportStatus, app.js) -- same pill
       shape as .rc-badge but its own class since colors differ. Sits
       between .report-item-info and .report-item-remove, not pushed to the
       far edge like the remove button. */
    .report-item-status {
      flex-shrink: 0;
      border: none;
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      transition: opacity .15s;
    }
    .report-item-status:hover { opacity: .8; }
    .report-item-status.status-unread { background: rgba(37,99,235,.18); color: var(--blue); }
    .report-item-status.status-read { background: rgba(var(--on-surface-rgb),.12); color: var(--text-3); }
    .report-item-status.status-solved { background: rgba(1,179,123,.22); color: var(--green); }
    /* Same compact icon-square as #history-clear-all-btn -- sits in
       .history-header-top next to "回報案件", reloads the list on demand
       (see refreshReportsList, app.js) so an admin doesn't have to close
       and reopen the drawer to see reports a background poll has already
       flagged via .has-report-alert below. */
    #reports-refresh-btn.btn {
      height: 28px;
      width: 28px;
      padding: 0;
      gap: 0;
      flex-shrink: 0;
    }
    /* Small red dot for "there's a report you haven't seen yet" (see
       setNewReportsAlert, app.js) -- toggled onto #admin-reports-btn while
       the drawer is closed, or onto #reports-refresh-btn while it's open,
       never both at once. The border punches a ring in the dot the same
       color as the page background, so it reads as a notch cut out of the
       button rather than a dot merely overlapping its edge. */
    .has-report-alert { position: relative; }
    .has-report-alert::after {
      content: "";
      position: absolute;
      top: -3px;
      right: -3px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #f43f5e;
      border: 2px solid var(--bg);
    }

    /* Centered toast shown while a download zip is being assembled --
       buildZip fetches each result image over the network before zipping,
       which is otherwise invisible/silent for a batch with many images. */
    .download-progress-toast {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
      z-index: 900;
      display: flex; flex-direction: column; gap: 8px;
      min-width: 240px; padding: 14px 18px;
      background: var(--card); border: 1px solid var(--border-2);
      border-radius: var(--radius); box-shadow: var(--shadow-lg);
    }
    .download-progress-toast[hidden] { display: none; }

    /* Shown by update-check.js when /api/version reports a newer frontend or
       worker build than the one this page loaded with. */
    .update-banner {
      position: fixed; left: 50%; top: 16px; transform: translateX(-50%);
      z-index: 950;
      display: flex; align-items: center; gap: 14px;
      max-width: calc(100vw - 32px);
      padding: 10px 16px;
      background: var(--card); border: 1px solid var(--border-2);
      border-radius: var(--radius-sm); box-shadow: var(--shadow-lg);
    }
    .update-banner[hidden] { display: none; }
    .update-banner-text { font-size: 13px; color: var(--text); }
    .update-banner-refresh {
      flex-shrink: 0; padding: 6px 14px; border: none; border-radius: 999px;
      background: var(--mv-grad); color: var(--n100); font-size: 13px; font-weight: 600;
      cursor: pointer;
    }
    .update-banner-refresh:hover { opacity: .9; }
    .download-progress-label { font-size: 13px; color: var(--text-2); text-align: center; }
    .download-progress-track {
      height: 6px; border-radius: 999px; background: var(--card-2); overflow: hidden;
    }
    .download-progress-fill {
      height: 100%; width: 0%; border-radius: inherit;
      background: var(--mv-grad); transition: width .2s ease;
    }
    /* ── Batch main-area loading/error placeholder and pre-edit review slot
       (analyzing/processing/error and "analyzed, awaiting review" states) ──
       Same .proc-visual/.think-ring/.proc-text markup+classes as the
       single-image processing screen (styles.css) -- only this wrapper and
       the error variant are batch-specific. */
    .batch-main-loading {
      display: flex; align-items: center; gap: 56px;
      min-height: 320px; padding: 40px 0;
    }
    #batch-main-loading-title { font-size: clamp(24px, 2.6vw, 32px); }
    /* Error: freeze the rings instead of spinning them (nothing is actually
       "thinking"), and let the thumb show plainly, same treatment
       .proc-visual.done uses for "analysis complete, ready" in the single-image
       flow -- just red-tinted since this is a failure, not a pause. */
    .batch-main-loading.is-error .think-ring { opacity: 0; animation-play-state: paused; }
    .batch-main-loading.is-error .think-center { inset: 0; border-radius: 14px; background: none; }
    .batch-main-loading.is-error .proc-thumb { border-radius: 14px; object-fit: contain; opacity: .5; }
    .batch-main-loading.is-error .proc-eyebrow { color: var(--red); }
    .batch-main-loading.is-error #batch-main-loading-title { color: var(--red); }
    @media (max-width: 900px) {
      .batch-main-loading { flex-direction: column; text-align: center; gap: 32px; }
    }

    @media (max-width: 900px) {
      .results-body { flex-direction: column; }
      /* Off-canvas drawer instead of the old "full-width, stacked above
         #results-detail" layout -- that used to push the actual working
         area (the swirl/compare card) below however many rows the batch
         list needed, which grew with the batch size. Toggled open/closed
         via openBatchDrawer/closeBatchDrawer in app.js (.drawer-open),
         triggered by #batch-drawer-trigger; only relevant while
         #results-body has "batch-mode" (single-image runs never show the
         trigger, see the .batch-drawer-trigger rule above). */
      .batch-sidebar {
        /* top: var(--header-h) (not 0) -- sits below the sticky
           .site-header/.header-inner, same as .batch-drawer-trigger, rather
           than sliding out from underneath it. */
        position: fixed; top: var(--header-h); left: 0; bottom: 0;
        /* min(220px, 68vw) (was min(320px, 85vw), then min(260px, 78vw)) --
           still read as covering most of the screen at typical phone
           widths; narrowed again so the backdrop clearly reads as the
           dominant surface with the drawer as a slim overlay panel. */
        width: min(220px, 68vw); flex-basis: auto;
        /* Cancels updateBatchSidebarMaxHeight's own inline max-height AND
           height (app.js) -- this drawer variant is already sized top:0
           bottom:0 (fixed), so an inline height would otherwise override
           that computed top-to-bottom span with whatever fixed pixel value
           JS last measured against the desktop layout. */
        max-height: none !important; height: auto !important; margin-top: 0;
        border-radius: 0; border-width: 0 1px 0 0;
        z-index: 1001;
        transform: translateX(-100%);
        transition: transform .25s ease;
      }
      .batch-sidebar.drawer-open { transform: translateX(0); }
      .results-body.batch-mode .batch-drawer-trigger { display: inline-flex; }
      .batch-sidebar-close-btn { display: flex; }
      .batch-sidebar-backdrop {
        /* Matches .batch-sidebar's own top offset -- the header stays
           unobscured (and clickable) while the drawer is open. */
        top: var(--header-h);
      }
      .batch-sidebar-backdrop.drawer-open { display: block; }
      /* Room for .batch-sidebar-close-btn (30px, inset 14px from the aside's
         edge) so a long "全部下載" label never runs underneath it. */
      .batch-sidebar-header { padding-right: 36px; }
      /* Shrink the thumbnail so .batch-sidebar-text/.rc-badge get a bit more
         of the drawer's already-tight width (min(220px, 68vw)) -- otherwise
         a longer status string (e.g. "完成 (3/3)" for a multi-RUN image)
         has too little room before its ellipsis kicks in.
         :not(.history-cube) -- .batch-sidebar-item is also reused on every
         .history-cube grid tile (renderHistoryList, app.js), whose own
         .rc-media is absolutely positioned to fill the whole square tile
         (inset:0, width/height:100%); this fixed 40x40 box would collapse
         that photo into a tiny corner instead of the intended full square. */
      .batch-sidebar-item:not(.history-cube) .rc-media { width: 40px; height: 40px; flex: 0 0 40px; }
    }

    .batch-continue-all-btn { width: 100%; justify-content: center; margin-bottom: 18px; }
    .batch-lock-toggle {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 10px;
      font-size: 11.5px;
      font-weight: 400;
      color: var(--text-3);
      cursor: pointer;
      user-select: none;
    }
    .batch-lock-toggle input { margin: 0; }

    /* ── 補充指令 label row: label + "overwrite" checkbox inline ── */
    .ap-prompt-label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
    }
    .ap-prompt-label-row .prompt-overwrite-toggle { margin-bottom: 0; }
    /* Dim/disable just the option list when locked -- the lock-toggle above
       it must stay clickable so the user can actually unlock it. */
    .ap-style-item.is-locked .step-inline-list { opacity: .45; pointer-events: none; }
    .ap-style-item.is-locked > .ap-style-trigger { opacity: .7; }
    /* Applied by applyPickerSingleOptionState (app.js) once debug-only
       candidates are filtered out and a single visible <option> is left --
       nothing to pick, so drop the dropdown arrow and disable the trigger
       entirely instead of opening a panel with one, already-selected row. */
    .ap-style-item.is-single-option > .ap-style-trigger { pointer-events: none; cursor: default; opacity: .7; }
    .ap-style-item.is-single-option > .ap-style-trigger::after { content: none; }
    body.is-opening-case > main { visibility: hidden; }
    /* header 的按鈕也一起等：剛進來還在上傳畫面的狀態（有版本紀錄、沒有回到首頁／新對話／
       最近照片），案例一打開才換成結果頁那一組；先藏著，換好那一刻跟照片一起出現，
       不讓人看到按鈕一顆顆增減。#report-btn 的 visibility 是 syncReportBtnPosition
       寫在 inline style 上的，所以要 !important。 */
    body.is-opening-case .header-actions,
    body.is-opening-case .header-icon-btn,
    body.is-opening-case #report-btn { visibility: hidden !important; }

    /* ── header 按鈕，跟對話模式（frontend-chat/src/chat.css）一樣 ──
       每顆都是同一款 32px 膠囊；圖示 14px，主題色塊也放大到 14px 跟它們對齊。 */
    #theme-toggle-btn .theme-toggle-swatch { width: 14px; height: 14px; }

    /* 平板（直拿 601–1200、橫拿 901–1200）：header 64px 高，按鈕放大到 44px 好按。
       要寫在下面 ⋯ 選單的規則前面，選單打開時才蓋得過這裡的高度。 */
    @media (min-width: 601px) and (max-width: 1200px) and (orientation: portrait),
           (min-width: 901px) and (max-width: 1200px) and (orientation: landscape) {
      html:root { --header-h: 64px; }
      .site-header .header-inner { padding: 0 20px 0 32px; }
      .site-header .header-actions > :is(#reset-btn, #new-chat-btn, #account-badge, #chat-ui-btn, #changelog-btn, #header-settings-btn, #admin-reports-btn, #cost-btn, #theme-toggle-btn),
      #report-btn.btn, #report-btn-spacer.btn { height: 44px; padding: 0 16px; }
    }

    /* ── 窄 header：手機（≤600px），以及攤開放不下的平板／小桌機（≤1279px）──
       logo · 新對話 · 最近照片 · ⋯；其他按鈕收進 ⋯ 展開的選單。對話模式在 940px 就攤開，
       但面板模式按鈕多（最多 9 顆，攤開約 920px 寬，加 logo 要 1230px 左右），所以斷點拉到 1279px。
       選單項目逐顆列 id，才蓋得過上面各按鈕自己的 id 樣式。 */
    .header-icon-btn, #header-menu-report-btn { display: none; }
    @media (max-width: 600px) {
      html:root { --header-h: 56px; }
      .site-header .header-inner { padding: 0 6px 0 16px; }
      .site-header .logo { font-size: 20px; }
    }
    @media (max-width: 1279px) {
      .site-header .header-inner { position: relative; }
      .header-icon-btn {
        display: flex; align-items: center; justify-content: center;
        width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%;
        background: transparent; color: var(--text-2); cursor: pointer;
      }
      .header-icon-btn:hover { background: rgba(var(--accent-rgb), .08); }
      #header-new-icon { margin-left: auto; }
      #header-more-btn[aria-expanded="true"] { background: rgba(var(--accent-rgb), .1); color: var(--accent); }
      /* 代按的那兩顆藏起來時，圖示也藏；第一顆不在時，下一顆接手把自己推到右邊。 */
      .site-header:has(#new-chat-btn[hidden]) #header-new-icon { display: none; }
      .site-header:has(#account-badge[hidden]) #header-history-icon { display: none; }
      .site-header:has(#new-chat-btn[hidden]) #header-history-icon,
      .site-header:has(#new-chat-btn[hidden]):has(#account-badge[hidden]) #header-more-btn { margin-left: auto; }
      /* 新對話、最近照片外面已經有了，選單裡不再重複；固定定位的回報改由選單裡那顆代按。 */
      #new-chat-btn.btn, #account-badge.btn, #report-btn-spacer.btn, #report-btn.btn { display: none; }

      .site-header .header-actions { display: none; }
      .site-header .header-actions.is-open {
        display: flex; flex-direction: column; align-items: stretch; gap: 2px;
        position: absolute; top: calc(100% + 4px); right: 16px; z-index: 1500;
        min-width: 200px; padding: 6px; border-radius: 16px;
        background: var(--card); border: 1px solid var(--border); box-shadow: 0 12px 32px rgba(0,0,0,.16);
      }
      .header-actions.is-open > :is(#reset-btn, #chat-ui-btn, #changelog-btn, #header-settings-btn, #admin-reports-btn, #cost-btn, #theme-toggle-btn, #header-menu-report-btn) {
        display: flex; width: 100%; height: 44px; justify-content: flex-start; gap: 10px;
        padding: 0 12px; border: 0; border-radius: 10px;
        background: transparent; color: var(--text); font-size: 14px; box-shadow: none;
      }
