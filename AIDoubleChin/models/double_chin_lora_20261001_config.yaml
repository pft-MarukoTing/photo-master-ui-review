job: extension
config:
  name: double_chin_exp_20261001
  process:
  - type: diffusion_trainer
    training_folder: output
    sqlite_db_path: ./aitk_db.db
    device: cuda
    trigger_word: null
    performance_log_every: 10
    network:
      type: lora
      linear: 16
      linear_alpha: 16
      conv: 16
      conv_alpha: 16
      lokr_full_rank: true
      lokr_factor: -1
      network_kwargs:
        ignore_if_contains: []
    save:
      dtype: bf16
      save_every: 100
      max_step_saves_to_keep: 40
      save_format: diffusers
      push_to_hub: false
    datasets:
    - folder_path: datasets/double_chin/train/target
      mask_path: null
      mask_min_value: 0.1
      default_caption: Remove the double chin. Keep the face identity, jawline position,
        skin texture, lighting and background unchanged.
      caption_ext: txt
      caption_dropout_rate: 0.05
      cache_latents_to_disk: false
      is_reg: false
      network_weight: 1
      resolution:
      - 1024
      controls: []
      shrink_video_to_frames: true
      num_frames: 1
      flip_x: false
      flip_y: false
      num_repeats: 1
      dataset_augmentations: []
      control_path_1: datasets/double_chin/train/control
      control_path_2: null
      control_path_3: null
    train:
      batch_size: 1
      balanced_dataset_sampling: false
      bypass_guidance_embedding: false
      steps: 6000
      gradient_accumulation: 1
      train_unet: true
      train_text_encoder: false
      gradient_checkpointing: true
      noise_scheduler: flowmatch
      optimizer: adamw8bit
      timestep_type: weighted
      content_or_style: balanced
      optimizer_params:
        weight_decay: 0.0001
      unload_text_encoder: false
      cache_text_embeddings: true
      lr: 0.0006
      ema_config:
        use_ema: true
        ema_decay: 0.99
      skip_first_sample: false
      force_first_sample: false
      disable_sampling: false
      dtype: bf16
      diff_output_preservation: false
      diff_output_preservation_multiplier: 1
      diff_output_preservation_class: person
      switch_boundary_every: 1
      loss_type: mse
    logging:
      log_every: 1
      use_ui_logger: true
    model:
      name_or_path: Qwen/Qwen-Image-Edit-2509
      quantize: true
      qtype: qfloat8
      quantize_te: true
      qtype_te: qfloat8
      arch: qwen_image_edit_plus
      low_vram: true
      model_kwargs:
        match_target_res: false
      layer_offloading: false
      layer_offloading_text_encoder_percent: 1
      layer_offloading_transformer_percent: 1
    sample:
      sampler: flowmatch
      sample_every: 100
      width: 1024
      height: 1024
      # Held-out test images (datasets/test_split.txt), never seen in training.
      samples:
      - prompt: Remove the double chin. Keep the face identity, jawline position, skin
          texture, lighting and background unchanged.
        ctrl_img_1: datasets/double_chin/test/control/42_36566_Original.jpg
      - prompt: Remove the double chin. Keep the face identity, jawline position, skin
          texture, lighting and background unchanged.
        ctrl_img_1: datasets/double_chin/test/control/64_60695_Original.jpg
      - prompt: Remove the double chin. Keep the face identity, jawline position, skin
          texture, lighting and background unchanged.
        ctrl_img_1: datasets/double_chin/test/control/44_66713_Original.jpg
      - prompt: Remove the double chin. Keep the face identity, jawline position, skin
          texture, lighting and background unchanged.
        ctrl_img_1: datasets/double_chin/test/control/36_39845_Original.jpg
      - prompt: Remove the double chin. Keep the face identity, jawline position, skin
          texture, lighting and background unchanged.
        ctrl_img_1: datasets/double_chin/test/control/IMG_8153.jpg
      - prompt: Remove the double chin. Keep the face identity, jawline position, skin
          texture, lighting and background unchanged.
        ctrl_img_1: datasets/double_chin/test/control/IMG_4786.jpg
      neg: ''
      seed: 42
      walk_seed: false
      guidance_scale: 4
      sample_steps: 10
      num_frames: 1
      fps: 1
meta:
  name: double_chin_exp_20261001
  version: '1.0'
